[package]
name = "TTManager"
version = "0.1.0"
edition = "2024"
authors = ["K4 <llamandoakalos@gmail.com>"]
description = "TTM (TuiTaskManager): a lightweight Linux system resource monitor TUI written in Rust"
readme = "README.md"
license = "MIT"

[[bin]]
name = "ttm"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
sysinfo = "0.39.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
