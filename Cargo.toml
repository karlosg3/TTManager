[package]
name = "TTManager"
version = "0.3.0"
edition = "2024"
authors = ["K4 <llamandoakalos@gmail.com>"]
description = "TTM (TuiTaskManager): a lightweight Linux system resource monitor TUI written in Rust"
readme = "README.md"
license = "MIT"

[[bin]]
name = "ttm"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
sysinfo = "0.39.6"
# Actualizador: HTTPS a GitHub, JSON de la API, checksum y extracción del .tar.gz
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
flate2 = "1.1.10"
tar = { version = "0.4.46", default-features = false }

# Metadatos para `cargo deb` (se usa en el workflow de release)
[package.metadata.deb]
name = "ttm"
maintainer = "K4 <llamandoakalos@gmail.com>"
section = "utils"
priority = "optional"
extended-description = """\
Monitor de recursos minimalista para la terminal: CPU, memoria, GPU, disco, \
procesos, puertos en escucha y batería."""
assets = [
    ["target/release/ttm", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/ttm/README.md", "644"],
]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
